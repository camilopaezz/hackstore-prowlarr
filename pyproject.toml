[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hackstore-prowlarr"
version = "0.1.0"
description = "Prowlarr indexer proxy for hackstore.fo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.0",
    "flask>=3.1.3",
    "requests>=2.34.2",
    "waitress>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.setuptools]
py-modules = ["proxy", "decrypt_url"]
